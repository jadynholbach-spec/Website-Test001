<!DOCTYPE html>
<html>
<head>
  <title>Photo Gallery</title>
  <meta charset="UTF-8">
  <style>
    body {
      background: #2b0035; /* dark purple */
      font-family: Arial, sans-serif;
      color: #fff;
      margin: 0;
      padding: 0;
      min-height: 100vh;
    }
    header {
      text-align: center;
      padding: 30px 10px 10px 10px;
    }
    .gallery {
      display: flex;
      justify-content: center;
      gap: 30px;
      margin-top: 40px;
      flex-wrap: wrap;
    }
    .gallery img {
      width: 250px;
      max-width: 90vw;
      border-radius: 12px;
      box-shadow: 2px 2px 16px #0008;
      border: 4px solid #fff2;
      transition: transform 0.2s;
    }
    .gallery img:hover {
      transform: scale(1.04);
      border-color: #fff;
    }
    footer {
      margin-top: 50px;
      color: #bbb;
      font-size: 0.9em;
      text-align: center;
      padding-bottom: 20px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Photo Gallery</h1>
    <p>Some of my favorite memories</p>
  </header>
  <div class="gallery">
    <img src="2.png" alt="Gallery photo 1">
    <img src="3.png" alt="Gallery photo 2">
    <img src="4.png" alt="Gallery photo 3">
  </div>
  <footer>
    <p>© 2026 Jadyn Holbach</p>
  </footer>
</body>
</html>
